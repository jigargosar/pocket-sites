<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live earthquakes from the USGS feed on a spinning night globe. Click a quake to fly there.">
<title>Globe Pulse · live earthquakes</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eef; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #panel { position: fixed; top: 20px; left: 20px; width: 300px; max-height: calc(100vh - 40px); overflow: auto; padding: 20px; box-sizing: border-box; background: rgba(10, 12, 24, .72); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .03em; }
  .sub { margin: 4px 0 16px; color: #8a90b0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  select { width: 100%; padding: 8px 10px; border-radius: 8px; background: #151a30; color: #eef; border: 1px solid #2a3050; font: inherit; font-size: 13px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .stats div { background: rgba(255, 255, 255, .04); border-radius: 10px; padding: 10px 12px; }
  .stats b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: #8a90b0; text-transform: uppercase; letter-spacing: .1em; }
  h2 { font-size: 11px; color: #8a90b0; text-transform: uppercase; letter-spacing: .15em; margin: 18px 0 8px; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  li:hover { background: rgba(255, 255, 255, .06); }
  .mag { font-weight: 800; text-align: center; border-radius: 6px; padding: 4px 0; color: #111; }
  .when { color: #8a90b0; font-size: 11px; }
  .legend { height: 8px; border-radius: 4px; margin-top: 6px; }
  .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #8a90b0; margin-top: 4px; }
  #status { font-size: 11px; color: #8a90b0; margin-top: 14px; }
  .tip { background: rgba(10, 12, 24, .9); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div id="globe"></div>
<aside id="panel">
  <h1>🌍 Globe Pulse</h1>
  <p class="sub">Live earthquakes · USGS</p>
  <select id="feed">
    <option value="all_day">All quakes, past day</option>
    <option value="2.5_week">M2.5+, past week</option>
    <option value="4.5_month">M4.5+, past month</option>
  </select>
  <div class="stats">
    <div><b id="count">–</b><span>quakes</span></div>
    <div><b id="maxmag">–</b><span>strongest</span></div>
  </div>
  <h2>Magnitude</h2>
  <div class="legend" id="legend"></div>
  <div class="legend-labels"><span>0</span><span>2</span><span>4</span><span>6</span><span>7+</span></div>
  <h2>Strongest · click to fly</h2>
  <ol id="list"></ol>
  <p id="status"></p>
</aside>

<script>
const status = document.getElementById('status');
addEventListener('unhandledrejection', (e) => { status.textContent = `Error: ${e.reason.message}`; });

const color = d3.scaleSequential(d3.interpolateYlOrRd).domain([0, 7]).clamp(true);
document.getElementById('legend').style.background =
  `linear-gradient(to right, ${d3.range(0, 1.01, 0.1).map((t) => color(t * 7)).join(',')})`;

const ago = (t) => {
  const s = (Date.now() - t) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
};

const IMG = 'https://cdn.jsdelivr.net/npm/three-globe/example/img/';
const world = new Globe(document.getElementById('globe'))
  .globeImageUrl(IMG + 'earth-night.jpg')
  .bumpImageUrl(IMG + 'earth-topology.png')
  .backgroundImageUrl(IMG + 'night-sky.png')
  .pointLat('lat')
  .pointLng('lng')
  .pointAltitude((d) => Math.max(0.005, d.mag * 0.025))
  .pointRadius((d) => 0.15 + Math.max(0, d.mag) * 0.08)
  .pointColor((d) => color(d.mag))
  .pointLabel((d) => `<div class="tip"><b>M${d.mag.toFixed(1)}</b> · ${d.place}<br>${new Date(d.time).toLocaleString()} · depth ${d.depth.toFixed(0)} km</div>`)
  .onPointClick((d) => window.open(d.url, '_blank'))
  .ringLat('lat')
  .ringLng('lng')
  .ringColor((d) => (t) => { const c = d3.color(color(d.mag)); c.opacity = 1 - t; return c.formatRgb(); })
  .ringMaxRadius((d) => Math.max(1, d.mag * 1.6))
  .ringPropagationSpeed(2)
  .ringRepeatPeriod((d) => Math.max(500, 1600 - d.mag * 150));

world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 0.5;
world.pointOfView({ altitude: 2.3 });

let resumeTimer = null;
function flyTo(d) {
  world.controls().autoRotate = false;
  world.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.3 }, 1600);
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => { world.controls().autoRotate = true; }, 8000);
}

const feedSel = document.getElementById('feed');

async function load() {
  status.textContent = 'Loading…';
  const res = await fetch(`https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feedSel.value}.geojson`);
  if (!res.ok) throw new Error(`USGS feed returned ${res.status}`);
  const json = await res.json();

  const quakes = json.features
    .filter((f) => f.properties.mag != null)
    .map((f) => ({
      lng: f.geometry.coordinates[0],
      lat: f.geometry.coordinates[1],
      depth: f.geometry.coordinates[2],
      mag: f.properties.mag,
      place: f.properties.place ?? 'Unknown location',
      time: f.properties.time,
      url: f.properties.url,
    }));

  const byMag = d3.sort(quakes, (a, b) => d3.descending(a.mag, b.mag));
  world.pointsData(quakes);
  world.ringsData(byMag.slice(0, 60));

  document.getElementById('count').textContent = quakes.length.toLocaleString();
  document.getElementById('maxmag').textContent = byMag.length ? `M${byMag[0].mag.toFixed(1)}` : '–';

  d3.select('#list')
    .selectAll('li')
    .data(byMag.slice(0, 8))
    .join('li')
    .html((d) => `<span class="mag" style="background:${color(d.mag)}">${d.mag.toFixed(1)}</span><span>${d.place}<br><span class="when">${ago(d.time)}</span></span>`)
    .on('click', (_, d) => flyTo(d));

  status.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 5 min`;
}

feedSel.addEventListener('change', load);
addEventListener('resize', () => world.width(innerWidth).height(innerHeight));
setInterval(load, 5 * 60 * 1000);
load();
</script>
</body>
</html>
