<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The current time as three planets orbiting a glowing sun in 3D. Drag to orbit, scroll to zoom.">
<title>Orbit Clock</title>
<style>
  html, body { margin: 0; height: 100%; background: #03040a; color: #e8e6ff; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #time { font-size: clamp(40px, 8vw, 88px); font-weight: 200; letter-spacing: .08em; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(255, 190, 120, .35); }
  #date { opacity: .55; letter-spacing: .3em; text-transform: uppercase; font-size: 12px; margin-top: 6px; }
  #legend { position: fixed; top: 22px; left: 24px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .75; line-height: 2.1; }
  #legend h1 { font-size: 13px; font-weight: 600; letter-spacing: .35em; margin: 0 0 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
  #hint { position: fixed; top: 22px; right: 24px; font-size: 11px; letter-spacing: .15em; opacity: .4; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<div id="legend">
  <h1>Orbit Clock</h1>
  <div><span class="dot" style="background:#ff7a59"></span>Hours</div>
  <div><span class="dot" style="background:#5ad1ff"></span>Minutes</div>
  <div><span class="dot" style="background:#c9a7ff"></span>Seconds</div>
</div>
<div id="hint">Drag to orbit · scroll to zoom</div>
<div id="hud"><div id="time">--:--:--</div><div id="date"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 90, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 90;

// Starfield
const starCount = 3000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starPos.length; i += 3) {
  const r = 150 + Math.random() * 250;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  starPos[i] = r * Math.sin(ph) * Math.cos(th);
  starPos[i + 1] = r * Math.cos(ph);
  starPos[i + 2] = r * Math.sin(ph) * Math.sin(th);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 }));
scene.add(stars);

// Sun with glow
const sun = new THREE.Mesh(new THREE.SphereGeometry(2, 48, 48), new THREE.MeshBasicMaterial({ color: 0xffd27a }));
scene.add(sun);

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,215,130,1)');
  grd.addColorStop(0.25, 'rgba(255,150,60,0.45)');
  grd.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false }));
glow.scale.set(14, 14, 1);
scene.add(glow);

scene.add(new THREE.PointLight(0xffe2b0, 4, 0, 0));
scene.add(new THREE.AmbientLight(0x6070a0, 0.35));

// 12 o'clock is -z, 3 o'clock is +x, so the clock reads naturally from the default view.
const polar = (r, frac) => {
  const a = frac * Math.PI * 2;
  return new THREE.Vector3(Math.sin(a) * r, 0, -Math.cos(a) * r);
};

function orbitRing(r, color, opacity) {
  const pts = [];
  for (let i = 0; i <= 256; i++) pts.push(polar(r, i / 256));
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  ));
}

const bodies = [
  { r: 5, size: 0.9, color: 0xff7a59 },
  { r: 8.5, size: 0.65, color: 0x5ad1ff },
  { r: 12, size: 0.4, color: 0xc9a7ff },
];
for (const b of bodies) {
  orbitRing(b.r, b.color, 0.35);
  b.mesh = new THREE.Mesh(
    new THREE.SphereGeometry(b.size, 32, 32),
    new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.55, metalness: 0.1, emissive: b.color, emissiveIntensity: 0.18 })
  );
  scene.add(b.mesh);
}

// Hour markers on an outer dial
orbitRing(14, 0x8888aa, 0.25);
for (let i = 0; i < 12; i++) {
  const major = i % 3 === 0;
  const tick = new THREE.Mesh(
    new THREE.SphereGeometry(major ? 0.2 : 0.1, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: major ? 0.9 : 0.45 })
  );
  tick.position.copy(polar(14, i / 12));
  scene.add(tick);
}

// Intro and ambient motion
gsap.to(camera.position, { x: 0, y: 16, z: 20, duration: 3.2, ease: 'power3.inOut' });
gsap.to(glow.scale, { x: 16.5, y: 16.5, duration: 2.2, yoyo: true, repeat: -1, ease: 'sine.inOut' });

const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');
const secMesh = bodies[2].mesh;
let lastSec = -1;

function frame() {
  const now = new Date();
  const sec = now.getSeconds() + now.getMilliseconds() / 1000;
  const min = now.getMinutes() + sec / 60;
  const hr = (now.getHours() % 12) + min / 60;

  bodies[0].mesh.position.copy(polar(bodies[0].r, hr / 12));
  bodies[1].mesh.position.copy(polar(bodies[1].r, min / 60));
  bodies[2].mesh.position.copy(polar(bodies[2].r, sec / 60));

  if (now.getSeconds() !== lastSec) {
    lastSec = now.getSeconds();
    timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    gsap.fromTo(secMesh.scale, { x: 1.8, y: 1.8, z: 1.8 }, { x: 1, y: 1, z: 1, duration: 0.7, ease: 'power3.out' });
  }

  sun.rotation.y += 0.002;
  stars.rotation.y += 0.00008;
  for (const b of bodies) b.mesh.rotation.y += 0.01;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
