name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned: Edge is verified preinstalled on the Ubuntu 24.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Screenshots and index page
        run: pnpm build
      - uses: actions/configure-pages@v5
      - name: Upload every folder in sites/
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites
      - id: deployment
        uses: actions/deploy-pages@v4
